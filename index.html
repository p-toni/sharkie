<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#000; color:#fff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:#000; }
      main { min-height:100vh; display:grid; grid-template-rows:1fr auto; }
      .stage { min-height:70vh; display:grid; place-items:center; overflow:hidden; }
      #sharkie { width:min(54vw, 520px); aspect-ratio:1.35; }
      .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:24px; }
      button { border:1px solid #333; background:#0c0c0c; color:#fff; padding:9px 13px; border-radius:999px; cursor:pointer; font:inherit; }
      button:hover, button:focus-visible { border-color:#777; outline:none; }
      p { text-align:center; color:#777; margin:0 0 24px; font-size:13px; }
    </style>
  </head>
  <body>
    <main>
      <section class="stage"><div id="sharkie"></div></section>
      <footer>
        <div class="controls">
          <button data-state="idle">idle</button>
          <button data-state="happy">happy</button>
          <button data-state="curious">curious</button>
          <button data-state="chomp">chomp</button>
          <button data-state="bounce">bounce</button>
          <button data-state="peek">peek</button>
          <button data-state="dive">dive</button>
        </div>
        <p>Move the pointer around Sharkie.</p>
      </footer>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
